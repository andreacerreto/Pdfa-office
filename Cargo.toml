[package]
name = "pdfa-office"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Convertitore desktop locale da PDF a PDF/A con validazione veraPDF"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
lopdf = { version = "0.38", default-features = false }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "persistence", "accesskit"] }
rfd = { version = "0.15", optional = true }

[[bin]]
name = "pdfa-office"
path = "src/bin/pdfa-office.rs"
required-features = ["desktop"]

[[bin]]
name = "pdfa-office-cli"
path = "src/bin/pdfa-office-cli.rs"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

